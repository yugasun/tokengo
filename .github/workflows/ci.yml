name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test token-usage-advisor
        working-directory: skills/token-usage-advisor
        run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test*.py'
          python scripts/token_usage.py --help
